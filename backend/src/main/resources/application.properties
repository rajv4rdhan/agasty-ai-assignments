spring.application.name=rag

# Database Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ragdb}
spring.datasource.username=${DB_USER:raguser}
spring.datasource.password=${DB_PASSWORD:ragpass}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.clean-disabled=false

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Async Configuration
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=8
spring.task.execution.pool.queue-capacity=100

# JVM Settings (for reference - set these in your IDE run configuration)
# -Xms512m -Xmx2048m

# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Gemini AI Configuration (Google AI Studio API Key approach)
spring.ai.vertex.ai.gemini.api-key=${GEMINI_API_KEY:}
spring.ai.vertex.ai.gemini.chat.options.model=${GEMINI_MODEL:gemini-1.5-flash}
spring.ai.vertex.ai.gemini.chat.options.temperature=0.3
spring.ai.vertex.ai.gemini.embedding.options.model=${GEMINI_EMBEDDING_MODEL:text-embedding-004}

# RAG Configuration
rag.chunk-size=500
rag.chunk-overlap=50
rag.retrieval.top-k=5
rag.retrieval.similarity-threshold=0.7
rag.batch-size=${RAG_BATCH_SIZE:5}

# Conversation History Configuration
rag.conversation.max-turns=10
rag.conversation.max-tokens=4000

# Enhanced Retrieval Configuration
rag.retrieval.use-hybrid=true
rag.retrieval.use-query-rewriting=true
rag.retrieval.use-reranking=true
rag.retrieval.rerank-candidates=15
rag.retrieval.vector-weight=0.7
rag.retrieval.fulltext-weight=0.3

# OCR.space API Configuration
ocr.api.key=${OCR_API_KEY:K86273271288957}
